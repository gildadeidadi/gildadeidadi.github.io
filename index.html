<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gilda dei Dadi</title>
<style>
  :root {
    --ink: #1a0e06;
    --ember: #c05a1e;
    --gold: #c9922a;
    --parch: #f5ede0;
    --vellum: #e8d9c4;
    --smoke: #7a5c3e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
    background: radial-gradient(circle at 50% 0%, #fffaf2 0%, var(--parch) 55%, var(--vellum) 100%);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
  }
  main {
    max-width: 32rem;
    text-align: center;
  }
  .logo { width: 76px; height: 76px; margin: 0 auto 1.5rem; display: block; }
  h1 {
    margin: 0 0 .75rem;
    font-size: clamp(1.6rem, 5vw, 2.1rem);
    font-weight: 700;
    letter-spacing: -.01em;
  }
  .lead {
    margin: 0;
    font-size: 1.05rem;
    color: var(--smoke);
  }
  .rule {
    width: 64px;
    height: 2px;
    margin: 1.75rem auto;
    border: 0;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .soon {
    margin: 0 0 1.75rem;
    font-weight: 600;
    color: var(--ember);
    letter-spacing: .02em;
  }
  .note {
    margin: 0;
    font-size: .82rem;
    color: var(--smoke);
  }
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 52 52" role="img" aria-label="Gilda dei Dadi">
    <rect x="4" y="4" width="44" height="44" rx="10" stroke="#c05a1e" stroke-width="2.5" fill="#fdf6ec"/>
    <circle cx="17" cy="17" r="4" fill="#c9922a"/>
    <circle cx="35" cy="17" r="4" fill="#c9922a"/>
    <circle cx="26" cy="26" r="4" fill="#c9922a"/>
    <circle cx="17" cy="35" r="4" fill="#c9922a"/>
    <circle cx="35" cy="35" r="4" fill="#c9922a"/>
  </svg>

  <h1>Gilda dei Dadi</h1>
  <p class="lead">
    Stiamo preparando il nuovo portale: prenotazioni, area utente e pannello
    organizzatore stanno arrivando.
  </p>

  <hr class="rule">
  <p class="soon">Torna a trovarci presto</p>

  <p class="note">Associazione Gilda dei Dadi · Vanzago</p>
</main>
</body>
</html>
